<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ec">
  <title>鹈鹕的海岸骑行</title>
  <style>
    :root{color-scheme:light;--paper:#f7f5ec;--ink:#254d4c;--muted:#647976;--line:#d8dfd3;--accent:#e98c59;--teal:#356d66}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,sans-serif}
    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .page{max-width:1200px;margin:auto;padding:34px 40px 24px}
    .masthead{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:24px}
    .eyebrow{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:700;letter-spacing:2.3px}
    .brand-mark{width:24px;height:24px;flex:none}
    .edition{font-size:11px;letter-spacing:1.6px;color:var(--muted)}
    .intro{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:24px}
    h1{font-size:clamp(28px,3.5vw,43px);font-weight:650;letter-spacing:1px;margin:0;line-height:1.35}
    .intro p{margin:0 0 4px;color:var(--muted);font-size:13px;letter-spacing:.7px;line-height:1.7}
    .stage-shell{position:relative;border:1px solid #cad6c8;border-radius:24px;overflow:hidden;background:#e8eee3;isolation:isolate}
    #pelican-ride{position:relative;width:100%;height:100%;aspect-ratio:1280/820;overflow:hidden}
    .scene{width:100%;height:100%;display:block}
    svg .outline{stroke:#355650;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    svg .fine{fill:none;stroke:#355650;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    svg .leg-segment{transform-origin:0 0;transform-box:view-box}
    svg .animated{transform-box:view-box;transform-origin:0 0;will-change:transform}
    .stage-caption{position:absolute;left:28px;top:24px;display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:2px;color:#456963;pointer-events:none}
    .stage-caption i{width:5px;height:5px;border-radius:50%;background:#df8053}
    .scene-note{position:absolute;right:28px;bottom:21px;color:#526c61;font-size:10px;letter-spacing:2px;pointer-events:none}
    .controls{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 2px 18px;border-bottom:1px solid var(--line)}
    .playback{display:flex;align-items:center;gap:8px}
    .button{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:24px;padding:9px 18px;cursor:pointer;font-size:12px;transition:background .18s,border-color .18s}
    .button:hover{background:#eaeede;border-color:#a7bbb0}
    .button.primary{background:var(--teal);color:#fbf8ed;border-color:var(--teal);min-width:110px}
    .button.primary:hover{background:#285b55}
    .button.icon-only{width:42px;padding:10px}
    .button svg{width:15px;height:15px;display:block}
    .button:focus-visible,input:focus-visible{outline:3px solid #e79c65;outline-offset:4px}
    .speed-control{display:flex;align-items:center;gap:13px;font-size:12px;color:var(--muted)}
    .speed-control input{width:128px;accent-color:var(--teal);cursor:pointer}
    .speed-control output{color:var(--ink);font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
    .footer{display:flex;justify-content:space-between;gap:16px;padding-top:15px;font-size:10px;letter-spacing:1px;color:var(--muted)}
    .footer .dot{padding:0 7px;color:#b18d69}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(min-width:1500px){.page{padding-top:46px}}
    @media(max-width:640px){.page{padding:22px 18px}.masthead{margin-bottom:27px}.edition{font-size:9px;letter-spacing:.6px}.eyebrow{font-size:9px;letter-spacing:1.2px}.intro{display:block;margin-bottom:20px}.intro p{margin-top:10px;font-size:12px}.stage-shell{border-radius:18px}.stage-caption{top:14px;left:16px;font-size:7px;letter-spacing:1px}.scene-note{right:14px;bottom:12px;font-size:7px;letter-spacing:1px}.controls{gap:12px;flex-wrap:wrap;padding:16px 0}.speed-control{gap:8px}.speed-control input{width:85px}.button{padding:8px 14px}.footer{font-size:9px;letter-spacing:.3px}.footer span:last-child{text-align:right}}
    @media(max-width:380px){.controls{align-items:flex-start}.speed-control{width:100%;padding:8px 6px 0}.speed-control input{flex:1}.edition{display:none}}
  </style>
</head>

  <script>
    (() => {
      'use strict';
      // Native, seekable keyframes. Every illustrated detail is inline SVG.
      // Finite repeat counts keep the composition compatible with frame seeking;
      // ordinary playback runs for over two years before reaching its endpoint.
      const animations = [];
      const repeatCount = 40000000;
      const cycleMs = 2000;
      const samples = 120;
      const byId = id => document.getElementById(id);
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !reducedMotion.matches;
      let speed = 1;

      function animate(id, frames, duration, extra = {}) {
        const animation = byId(id).animate(frames, {
          duration, iterations: repeatCount, easing: 'linear', fill: 'both', ...extra
        });
        animation.pause();
        animation.currentTime = 0;
        animations.push(animation);
        return animation;
      }
      function sampled(fn) {
        return Array.from({length:samples + 1}, (_, i) => ({offset:i / samples, ...fn(i / samples * Math.PI * 2)}));
      }
      function number(n) { return Number(n.toFixed(4)); }
      function translation(x,y) { return `translate(${number(x)}px, ${number(y)}px)`; }

      // Two-bone inverse kinematics keeps the knees on one bend branch and both
      // feet on opposite ends of the crank throughout the complete pedal cycle.
      function legPose(theta, phase) {
        const a = theta + phase;
        const bob = Math.sin(theta * 2) * 3;
        const hip = {x:596, y:462 + bob};
        const pedal = {x:622 + 34 * Math.cos(a), y:619 + 34 * Math.sin(a)};
        const ankle = {x:pedal.x - 7, y:pedal.y - 7};
        const upper = 100, lower = 108;
        const dx = ankle.x - hip.x, dy = ankle.y - hip.y;
        const distance = Math.hypot(dx,dy);
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upper * upper - along * along));
        const knee = {
          x:hip.x + along * dx / distance + height * dy / distance,
          y:hip.y + along * dy / distance - height * dx / distance
        };
        return {hip, knee, ankle, pedal};
      }
      function segment(from,to) {
        const angle = Math.atan2(to.y-from.y,to.x-from.x) * 180 / Math.PI;
        const length = Math.hypot(to.x-from.x,to.y-from.y);
        return `${translation(from.x,from.y)} rotate(${number(angle)}deg) scaleX(${number(length / 100)})`;
      }
      ['near','far'].forEach((side,index) => {
        const phase = index * Math.PI;
        animate(`${side}-upper`, sampled(theta => { const p=legPose(theta,phase); return {transform:segment(p.hip,p.knee)}; }), cycleMs);
        animate(`${side}-lower`, sampled(theta => { const p=legPose(theta,phase); return {transform:segment(p.knee,p.ankle)}; }), cycleMs);
        animate(`${side}-foot`, sampled(theta => { const p=legPose(theta,phase); return {transform:translation(p.pedal.x-7,p.pedal.y-7)}; }), cycleMs);
        animate(`${side}-pedal`, sampled(theta => { const p=legPose(theta,phase); return {transform:translation(p.pedal.x-7,p.pedal.y-7)}; }), cycleMs);
      });
      animate('crank',[{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],cycleMs);
      animate('pelican-body',sampled(t=>({transform:translation(0,Math.sin(t*2)*3)})),cycleMs);
      // Pivot at the fixed grip, allowing the shoulder end to rise and fall.
      animate('front-wing',sampled(t=>({transform:`translate(786px, 442px) rotate(${number(-Math.sin(t*2)*.8)}deg) translate(-786px, -442px)`})),cycleMs);
      animate('scarf-tail',sampled(t=>({transform:`translate(688px, 360px) rotate(${number(Math.sin(t)*3)}deg) scaleY(${number(1+Math.sin(t+1)*.035)}) translate(-688px, -360px)`})),cycleMs);
      animate('rear-wheel',[{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],3000);
      animate('front-wheel',[{transform:'rotate(0deg)'},{transform:'rotate(360deg)'}],3000);
      animate('clouds',[{transform:'translateX(0px)'},{transform:'translateX(-1280px)'}],96000);
      animate('sea-lines',[{transform:'translateX(0px)'},{transform:'translateX(-1280px)'}],48000);
      animate('scenery',[{transform:'translateX(0px)'},{transform:'translateX(-1280px)'}],24000);
      animate('foreground',[{transform:'translateX(0px)'},{transform:'translateX(-1280px)'}],12000);
      // 720 units per revolution closely match the tire's circumference.
      animate('road',[{transform:'translateX(0px)'},{transform:'translateX(-720px)'}],3000);
      animate('sky-birds',sampled(t=>({transform:translation(Math.sin(t)*7,Math.sin(t*2)*3)})),12000);
      animate('breeze',sampled(t=>({transform:translation(-Math.sin(t)*8,0),opacity:number(.48+.2*Math.sin(t))})),4000);
      animate('bike-shadow',sampled(t=>({opacity:number(.16+Math.sin(t*2)*.015)})),cycleMs);

      function syncTime(time) { animations.forEach(a => { a.currentTime=time; }); }
      function syncControls() {
        byId('play-label').textContent = playing ? '暂停一下' : '继续骑行';
        byId('play-toggle').setAttribute('aria-label',playing ? '暂停动画' : '播放动画');
        byId('play-toggle').setAttribute('aria-pressed',String(!playing));
        byId('play-icon').setAttribute('d',playing ? 'M4 3h3v10H4zM9 3h3v10H9z' : 'M4 2l10 6-10 6z');
      }
      function setPlaying(value,announce = false) {
        const commonTime = animations[0].currentTime || 0;
        playing = value;
        animations.forEach(a => {
          a.pause();
          a.currentTime=commonTime;
          if (playing) a.play();
        });
        syncControls();
        if (announce) byId('play-status').textContent=playing ? '骑行继续' : '骑行已暂停';
      }
      byId('play-toggle').addEventListener('click',()=>setPlaying(!playing,true));
      byId('restart').addEventListener('click',()=>{
        syncTime(0);
        setPlaying(true);
        byId('play-status').textContent='已重新开始骑行';
      });
      byId('speed').addEventListener('input',event=>{
        speed=Number(event.target.value);
        const commonTime=animations[0].currentTime || 0;
        animations.forEach(a=>{a.currentTime=commonTime;a.playbackRate=speed;});
        byId('speed-value').value=`${speed}×`;
        byId('speed').setAttribute('aria-valuetext',`${speed} 倍速度`);
      });
      reducedMotion.addEventListener('change',event=>setPlaying(!event.matches));

      // HyperFrames can seek these native Animation objects without a dependency.
      // A small public API also makes individual pedal phases easy to inspect.
      window.pelicanRide=Object.freeze({
        pause:()=>setPlaying(false),
        play:()=>setPlaying(true),
        seek:seconds=>{setPlaying(false);syncTime(Math.max(0,Number(seconds)||0)*1000);},
        getState:()=>({playing,speed,time:(animations[0].currentTime||0)/1000,animationCount:animations.length}),
        legPose
      });
      syncControls();
      if (playing) setPlaying(true);
    })();
  </script>
</body>
</html>
